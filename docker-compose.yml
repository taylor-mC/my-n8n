version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678" # يربط المنفذ 5678 في الخادم بالمنفذ 5678 داخل الحاوية
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=YourStrongPasswordHere
      - WEBHOOK_URL=https://sad0s.xyz / # <== مهم جداً! ضع دومينك هنا
      - GENERIC_TIMEZONE=Asia/Amman
    volumes:
      - n8n_data:/home/node/.n8n # لحفظ بيانات n8n (الوظائف، الإعدادات)

volumes:
  n8n_data:
